name: Verify

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  BOT: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  backend:
    name: Backend and frozen presentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend intelligence routing security scripts tests --select F
      - run: python -m pytest --junitxml=backend.junit.xml
      - run: python -m scripts.verify_presentation
      - run: python -m scripts.build_evidence && python -m scripts.build_diagrams
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-results
          path: backend.junit.xml

  browser:
    name: Three-role browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.browser_check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-workflow-evidence
          path: |
            data/demo/browser_check.json
            docs/assets/review_console*.png

  postgis:
    name: PostgreSQL and PostGIS integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: nalanetra_test
          POSTGRES_USER: nalanetra_test
          POSTGRES_PASSWORD: local-ci-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nalanetra_test -d nalanetra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NALA_TEST_DATABASE_URL: postgresql://nalanetra_test:local-ci-fixture-only@localhost:5432/nalanetra_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Apply the checked-in spatial schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect(os.environ['NALA_TEST_DATABASE_URL'], autocommit=True) as connection:
              connection.execute(Path('database/schema.sql').read_text())
          PY
      - run: python -m pytest tests/test_postgis.py --junitxml=postgis.junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: postgis-test-results
          path: postgis.junit.xml

  flutter:
    name: Flutter analysis, tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build web --release --no-pub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-web-review-build
          path: mobile/build/web

  android:
    name: Android debug review build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --no-pub --dart-define=NALANETRA_BACKEND_BASE_URL=http://10.0.2.2:8000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-emulator-review-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
