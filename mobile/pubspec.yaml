name: nalanetra_floodgrid
description: "NalaNetra FloodGrid - Municipal waterlogging response system for SIH 2026"
publish_to: 'none'
version: 2.0.0+200

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
  uses-material-design: true
  assets:
    - assets/
    - assets/india_flood/
    - assets/user_flood_incidents/
    - assets/user_dispatch_floods/
    - assets/user_municipal_notifications/
    - assets/user_heatmap_live_feed/
    - assets/user_verify_previews/
    - assets/user_crew_floods/
    - assets/user_active_job_floods/
    - assets/crew_avatars/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#002147"
  adaptive_icon_foreground: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#002366"
    theme_color: "#002366"
